services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: hospital_db
      MYSQL_USER: hms_user
      MYSQL_PASSWORD: hms_pass
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, retries: 20}
    volumes: [dbdata:/var/lib/mysql]
  web:
    build: .
    depends_on: {db: {condition: service_healthy}}
    environment:
      DATABASE_URL: mysql+pymysql://hms_user:hms_pass@db:3306/hospital_db?charset=utf8mb4
      SECRET_KEY: change-me
    ports: ["5000:5000"]
volumes: {dbdata: {}}
